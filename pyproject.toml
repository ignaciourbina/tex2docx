[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tex2docx"
version = "0.1.0"
description = "Bidirectional TeX-to-DOCX converter for academic papers"
requires-python = ">=3.12"
dependencies = [
    "pylatexenc>=3.0a30",
    "python-docx>=1.1.0",
    "click>=8.0",
    "Pillow>=10.0",
    "latex2mathml",
    "lxml",
]

[project.scripts]
tex2docx = "tex2docx.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/tex2docx"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov",
]
